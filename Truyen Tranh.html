<!DOCTYPE html>
<html lang="vi" x-data="mangaReader()" :class="{ 'dark': isDark }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chiếc Sân Trường Xanh</title>

    <!-- Tailwind CSS (Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            bg: '#EFF5F0',        // Màu nền xanh lá pastel rất dịu mắt
                            card: '#E2EBE3',      // Màu thẻ xanh mint nhạt
                            sage: '#5B8266',      // Xanh lá trà dịu
                            sageHover: '#46664F', 
                            wood: '#3E6B48',      // Xanh lá đậm thanh lịch
                            woodDark: '#284730',
                            darkBg: '#121A14',    // Nền tối tone xanh ngọc thẫm
                            darkCard: '#1C281F'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Alpine.js (State Management) -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        [x-cloak] { display: none !important; }
        
        /* Tối ưu hóa thanh cuộn mượt mà & dịu mắt */
        html {
            scroll-behavior: smooth;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.03);
        }
        ::-webkit-scrollbar-thumb {
            background: #5B8266;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #46664F;
        }

        /* --- HIỆU ỨNG LẬT TRANG SÁCH 3D --- */
        .book-stage {
            perspective: 1200px;
        }
        .page-turn-next {
            animation: flipNext 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            transform-origin: left center;
        }
        .page-turn-prev {
            animation: flipPrev 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            transform-origin: right center;
        }

        @keyframes flipNext {
            0% {
                transform: rotateY(30deg) scale(0.96);
                opacity: 0.5;
            }
            100% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
            }
        }

        @keyframes flipPrev {
            0% {
                transform: rotateY(-30deg) scale(0.96);
                opacity: 0.5;
            }
            100% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body class="bg-pastel-bg dark:bg-pastel-darkBg text-neutral-800 dark:text-neutral-100 font-sans min-h-screen flex flex-col transition-colors duration-300 select-none"
      @keydown.window="handleKeyPress($event)">

    <!-- ================= 1. THANH ĐIỀU HƯỚNG TRÊN (HEADER BAR) ================= -->
    <header class="sticky top-0 z-40 bg-pastel-bg/90 dark:bg-pastel-darkBg/90 backdrop-blur-md border-b border-pastel-sage/20 shadow-sm transition-all"
            x-show="showControls" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="-translate-y-full" x-transition:enter-end="translate-y-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            
            <!-- Tiêu đề truyện & Chương -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-2xl bg-pastel-sage flex items-center justify-center text-white shadow-sm">
                    <i data-lucide="book-open-check" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg text-pastel-woodDark dark:text-pastel-wood leading-tight">Chiếc Sân Trường Xanh</h1>
                    <p class="text-xs text-pastel-sage font-medium">Tập 1: Môi Trường Xanh - Vì Tương Lai</p>
                </div>
            </div>

            <!-- Công cụ nhanh phía trên -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- Nút Tải Ảnh Từ Máy -->
                <label class="cursor-pointer px-3 py-1.5 text-xs font-semibold rounded-xl bg-pastel-sage/20 hover:bg-pastel-sage/30 text-pastel-woodDark dark:text-pastel-wood transition flex items-center space-x-1.5 border border-pastel-sage/30" title="Chọn thư mục ảnh truyện khác từ máy tính">
                    <i data-lucide="upload" class="w-4 h-4"></i>
                    <span class="hidden md:inline">Đổi thư mục ảnh</span>
                    <input type="file" multiple accept="image/*" class="hidden" @change="loadLocalFiles($event)">
                </label>

                <!-- Chế độ Đọc (Cuộn dọc vs Từng trang) -->
                <button @click="toggleReadMode()" 
                        class="px-3 py-1.5 text-xs font-semibold rounded-xl bg-pastel-wood text-white hover:bg-pastel-woodDark transition flex items-center space-x-1.5 shadow-sm"
                        :title="mode === 'webtoon' ? 'Chuyển sang Lật Từng Trang 3D' : 'Chuyển sang Đọc Cuộn Dọc Nối Liền'">
                    <i :data-lucide="mode === 'webtoon' ? 'book-open' : 'rows-3'" class="w-4 h-4"></i>
                    <span class="hidden sm:inline" x-text="mode === 'webtoon' ? 'Lật Trang 3D' : 'Cuộn Dọc Nối Liền'"></span>
                </button>

                <!-- Giao diện Sáng / Tối -->
                <button @click="isDark = !isDark; updateIcons()" class="p-2 rounded-xl bg-pastel-sage/20 hover:bg-pastel-sage/30 text-pastel-woodDark dark:text-pastel-wood transition" title="Đổi màu giao diện">
                    <i :data-lucide="isDark ? 'sun' : 'moon'" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Nút Float Mở Lại Thanh Điều Khiển Khi Đang Ẩn -->
    <button x-show="!showControls" 
            @click="showControls = true" 
            x-transition 
            class="fixed top-4 right-4 z-50 p-3 rounded-full bg-pastel-wood text-white shadow-lg hover:scale-105 transition"
            title="Hiện thanh công cụ">
        <i data-lucide="eye" class="w-5 h-5"></i>
    </button>

    <!-- ================= 2. KHU VỰC HIỂN THỊ TRUYỆN MAIN ================= -->
    <main class="flex-1 w-full mx-auto px-0 sm:px-4 py-0 sm:py-4 flex flex-col items-center justify-center relative">
        
        <!-- HƯỚNG DẪN KHI TẢI THÀNH CÔNG -->
        <div x-show="customLoaded" x-cloak class="my-3 px-4 py-2 bg-pastel-sage/20 text-pastel-woodDark dark:text-pastel-wood rounded-xl text-xs font-semibold flex items-center space-x-2 border border-pastel-sage/30">
            <i data-lucide="check-circle-2" class="w-4 h-4"></i>
            <span>Đã tải thành công <strong x-text="pages.length"></strong> trang từ máy tính!</span>
        </div>

        <!-- CONTAINER CHÍNH CHỨA ẢNH (Thay đổi độ rộng linh hoạt) -->
        <div class="transition-all duration-300 flex flex-col items-center w-full"
             :style="mode === 'webtoon' ? 'width: 100%; max-width: 800px;' : `width: ${widthPercent}%;`">

            <!-- ---------------- CHẾ ĐỘ 1: CUỘN DỌC NỐI LIỀN (HOÀN TOÀN KHÔNG KHE HỞ) ---------------- -->
            <template x-if="mode === 'webtoon'">
                <div class="w-full flex flex-col items-center bg-white dark:bg-pastel-darkCard shadow-lg rounded-none sm:rounded-2xl overflow-hidden border border-pastel-sage/10">
                    <template x-for="(page, index) in pages" :key="index">
                        <div class="relative w-full m-0 p-0 leading-none">
                            <img :src="page" 
                                 :alt="'Trang ' + (index + 1)" 
                                 class="w-full h-auto block select-none m-0 p-0 border-0 align-middle" 
                                 loading="lazy"
                                 onerror="this.src='https://placehold.co/800x1200/EFF5F0/5B8266?text=L%E1%BB%97i+%E1%BA%A2nh+Trang+'+(index+1)">
                            
                            <!-- Nhãn số trang tinh tế ở góc phải -->
                            <div class="absolute bottom-3 right-3 bg-black/40 text-white text-[10px] font-medium px-2 py-0.5 rounded-md backdrop-blur-sm" 
                                 x-text="(index === 0 ? 'Bìa' : 'Trang ' + index) + ' / ' + (pages.length - 1)"></div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- ---------------- CHẾ ĐỘ 2: ĐỌC TỪNG TRANG (CÓ HIỆU ỨNG LẬT TRANG SÁCH 3D) ---------------- -->
            <template x-if="mode === 'paged'">
                <div class="w-full flex flex-col items-center space-y-4 book-stage">
                    <!-- Khung ảnh trang đơn có hiệu ứng lật 3D -->
                    <div class="relative w-full aspect-[2/3] sm:aspect-[3/4] max-h-[82vh] bg-white dark:bg-pastel-darkCard rounded-3xl overflow-hidden shadow-xl border border-pastel-sage/20 flex items-center justify-center group"
                         :class="flipDirection === 'next' ? 'page-turn-next' : (flipDirection === 'prev' ? 'page-turn-prev' : '')">
                        
                        <img :src="pages[currentPage]" 
                             :alt="'Trang ' + (currentPage + 1)" 
                             class="max-w-full max-h-full object-contain select-none"
                             onerror="this.src='https://placehold.co/800x1200/EFF5F0/5B8266?text=L%E1%BB%97i+%E1%BA%A2nh'">

                        <!-- Vùng click Trái / Phải để lật trang nhanh -->
                        <div @click="prevPage()" class="absolute inset-y-0 left-0 w-1/3 cursor-pointer z-10 flex items-center justify-start pl-4 opacity-0 hover:opacity-100 transition duration-200">
                            <div class="w-10 h-10 rounded-full bg-pastel-wood/80 text-white flex items-center justify-center backdrop-blur-sm shadow-md">
                                <i data-lucide="chevron-left" class="w-6 h-6"></i>
                            </div>
                        </div>
                        <div @click="nextPage()" class="absolute inset-y-0 right-0 w-1/3 cursor-pointer z-10 flex items-center justify-end pr-4 opacity-0 hover:opacity-100 transition duration-200">
                            <div class="w-10 h-10 rounded-full bg-pastel-wood/80 text-white flex items-center justify-center backdrop-blur-sm shadow-md">
                                <i data-lucide="chevron-right" class="w-6 h-6"></i>
                            </div>
                        </div>

                        <!-- Nhãn số trang cố định phía dưới ảnh -->
                        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-pastel-wood/90 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-md backdrop-blur-sm z-20"
                             x-text="(currentPage === 0 ? 'Bìa Truyện' : 'Trang ' + currentPage) + ' (' + (currentPage + 1) + '/' + pages.length + ')'"></div>
                    </div>

                    <!-- Thanh điều hướng lật trang bên dưới -->
                    <div class="flex items-center space-x-3 bg-white dark:bg-pastel-darkCard px-5 py-2.5 rounded-2xl border border-pastel-sage/20 shadow-sm">
                        <button @click="prevPage()" :disabled="currentPage === 0" class="px-3.5 py-2 rounded-xl bg-pastel-sage/20 hover:bg-pastel-sage/30 text-pastel-woodDark dark:text-pastel-wood font-semibold text-xs disabled:opacity-30 transition flex items-center space-x-1">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i>
                            <span>Trang trước</span>
                        </button>
                        
                        <span class="text-xs font-bold text-pastel-sage px-2" x-text="(currentPage === 0 ? 'Bìa' : 'Trang ' + currentPage) + ' / ' + (pages.length - 1)"></span>

                        <button @click="nextPage()" :disabled="currentPage === pages.length - 1" class="px-3.5 py-2 rounded-xl bg-pastel-wood text-white hover:bg-pastel-woodDark font-semibold text-xs disabled:opacity-30 transition flex items-center space-x-1 shadow-sm">
                            <span>Trang sau</span>
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </template>

        </div>

    </main>

    <!-- ================= 3. THANH CÔNG CỤ CỐ ĐỊNH PHÍA DƯỚI (BOTTOM FLOATING TOOLBAR) ================= -->
    <div class="fixed bottom-4 left-1/2 -translate-x-1/2 z-40 transition-all duration-300"
         x-show="showControls" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-y-full" x-transition:enter-end="translate-y-0">
        
        <div class="bg-white/90 dark:bg-pastel-darkCard/90 backdrop-blur-md px-4 py-2.5 rounded-full border border-pastel-sage/30 shadow-xl flex items-center space-x-2 sm:space-x-4">
            
            <!-- Chọn Kích Thước Khung Đọc (Width) -->
            <div class="flex items-center space-x-1 border-r border-pastel-sage/20 pr-3" x-show="mode === 'paged'">
                <span class="text-[11px] font-bold text-pastel-sage hidden sm:inline mr-1">Khung:</span>
                <button @click="widthPercent = 50" :class="widthPercent === 50 ? 'bg-pastel-sage text-white' : 'text-pastel-sage hover:bg-pastel-sage/10'" class="px-2.5 py-1 rounded-lg text-xs font-bold transition">50%</button>
                <button @click="widthPercent = 75" :class="widthPercent === 75 ? 'bg-pastel-sage text-white' : 'text-pastel-sage hover:bg-pastel-sage/10'" class="px-2.5 py-1 rounded-lg text-xs font-bold transition">75%</button>
                <button @click="widthPercent = 100" :class="widthPercent === 100 ? 'bg-pastel-sage text-white' : 'text-pastel-sage hover:bg-pastel-sage/10'" class="px-2.5 py-1 rounded-lg text-xs font-bold transition">100%</button>
            </div>

            <!-- Nút Toggle Chế Độ Đọc Dọc/Ngang -->
            <button @click="toggleReadMode()" class="flex items-center space-x-1.5 text-xs font-semibold text-pastel-woodDark dark:text-pastel-wood hover:opacity-80 transition px-2">
                <i :data-lucide="mode === 'webtoon' ? 'book-open' : 'rows-3'" class="w-4 h-4"></i>
                <span x-text="mode === 'webtoon' ? 'Đổi sang Lật Trang' : 'Đổi sang Cuộn Nối Liền'"></span>
            </button>

            <!-- Nút Ẩn Thanh Điều Khiển (Clean Screen) -->
            <button @click="showControls = false" class="p-2 rounded-full hover:bg-pastel-sage/20 text-pastel-sage transition" title="Ẩn thanh công cụ (Đọc toàn màn hình)">
                <i data-lucide="eye-off" class="w-4 h-4"></i>
            </button>
        </div>

    </div>

    <!-- Footer Ghi Chú -->
    <footer class="py-6 border-t border-pastel-sage/20 text-center text-xs text-pastel-sage font-medium" x-show="showControls">
        <p>Chiếc Sân Trường Xanh • Sử dụng phím ◄ ► trên bàn phím để lật trang 3D mượt mà</p>
    </footer>

    <!-- ================= 4. SCRIPT XỬ LÝ NỘI DUNG VÀ TÍNH NĂNG (ALPINE.JS) ================= -->
    <script>
        function mangaReader() {
            return {
                isDark: false,            // Chế độ tối
                showControls: true,       // Hiển thị toolbar
                mode: 'webtoon',          // 'webtoon' (cuộn nối liền) hoặc 'paged' (lật trang)
                widthPercent: 75,         // Độ rộng khung hiển thị (%): 50, 75, 100
                currentPage: 0,           // Trang hiện tại
                customLoaded: false,      // Đã tải file từ máy hay chưa
                flipDirection: '',        // Hướng lật trang ('next' hoặc 'prev') để tạo animation 3D

                // Đường dẫn bộ ảnh truyện "Chiếc Sân Trường Xanh" trong thư mục images
                pages: [
                    "images/1Bia.jpg",
                    "images/trang1.jpg",
                    "images/trang2.jpg",
                    "images/trang3.jpg",
                    "images/trang4.jpg",
                    "images/trang5.jpg",
                    "images/trang6.jpg",
                    "images/trang7.jpg",
                    "images/trang8.jpg",
                    "images/trang9.jpg",
                    "images/trang10.jpg"
                ],

                // Chuyển đổi giữa 2 chế độ đọc
                toggleReadMode() {
                    this.mode = this.mode === 'webtoon' ? 'paged' : 'webtoon';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    this.updateIcons();
                },

                // Lật sang trang tiếp theo có hiệu ứng 3D
                nextPage() {
                    if (this.currentPage < this.pages.length - 1) {
                        this.triggerFlip('next');
                        this.currentPage++;
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                },

                // Lùi về trang trước có hiệu ứng 3D
                prevPage() {
                    if (this.currentPage > 0) {
                        this.triggerFlip('prev');
                        this.currentPage--;
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                },

                // Kích hoạt class animation lật trang 3D
                triggerFlip(dir) {
                    this.flipDirection = dir;
                    setTimeout(() => {
                        this.flipDirection = '';
                    }, 500);
                },

                // Lật trang bằng phím mũi tên bàn phím (Left / Right)
                handleKeyPress(e) {
                    if (this.mode === 'paged') {
                        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                            this.nextPage();
                        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                            this.prevPage();
                        }
                    }
                },

                // Đọc file ảnh trực tiếp từ máy tính người dùng
                loadLocalFiles(event) {
                    const files = Array.from(event.target.files);
                    if (files.length === 0) return;

                    // Sắp xếp các trang file theo thứ tự tên
                    files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

                    // Tạo Blob URL
                    this.pages = files.map(file => URL.createObjectURL(file));
                    this.currentPage = 0;
                    this.customLoaded = true;
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    this.updateIcons();
                },

                // Khởi tạo và cập nhật các icon Lucide
                updateIcons() {
                    setTimeout(() => {
                        if (window.lucide) lucide.createIcons();
                    }, 50);
                },

                init() {
                    this.updateIcons();
                }
            }
        }
    </script>
</body>
</html>
